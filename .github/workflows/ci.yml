name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push must not cancel the image publish of the commit before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Static checks, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The database `db:diff` compares the schema with; the tests start their own.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/coworking
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:up
      - run: npm run db:deploy
      - run: npm run db:diff
      - run: npm test
      - run: npm run build

  smoke:
    name: Containers start and answer
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the database, the migration and the API
        run: docker compose up --build --wait
      - name: Call the API
        run: |
          curl --fail --silent http://127.0.0.1:4010/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4010/api/v1/auth/me)" = 401
          curl --fail --silent --request POST http://127.0.0.1:4010/api/v1/auth/login \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin@coworking.test","password":"demo1234"}'
      - name: Show the logs of a failed start
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove everything
        if: always()
        run: docker compose down --volumes

  images:
    name: Publish ${{ matrix.image }}
    needs: [checks, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: coworking-admin-nest
            target: runtime
          - image: coworking-admin-nest-migrate
            target: migrate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
